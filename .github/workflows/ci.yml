name: CI (Quality Gate & Automated Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Bun Tests & Electron Build Verification
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          CI=false /usr/local/bin/bun install --registry https://registry.npmmirror.com

      - name: Run Bun Core Architecture Tests (Evidence Gate)
        run: |
          /usr/local/bin/bun test tests/
