name: CD (Continuous Deployment to Remote Server)

on:
  workflow_run:
    workflows: ["CI (Quality Gate & Automated Tests)"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying Agent Server to ${{ secrets.SERVER_HOST }}..."
            
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/opt/claude-code-agent' }}"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Check if repo exists, clone or pull
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # Deploy using Docker Compose if docker exists, else use Bun directly
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              echo "🐳 Deploying via Docker Compose..."
              docker compose down --remove-orphans || true
              docker compose build
              docker compose up -d
            else
              echo "🥟 Deploying via Bun runtime..."
              if ! command -v bun >/dev/null 2>&1; then
                curl -fsSL https://bun.sh/install | bash
                export PATH="$HOME/.bun/bin:$PATH"
              fi
              bun install --production
              
              # Restart systemd or background daemon
              pkill -f "src/server/index.ts" || true
              nohup bun run src/server/index.ts > server.log 2>&1 &
            fi

            echo "✅ Deployment completed successfully! Testing health check:"
            sleep 2
            curl -f http://127.0.0.1:3456/health || echo "⚠️ Warning: Health check timed out"
