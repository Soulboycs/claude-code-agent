name: CD (Continuous Deployment to Remote Server)

on:
  workflow_run:
    workflows: ["CI (Quality Gate & Automated Tests)"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: [self-hosted, Linux, X64]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Automated Self-Healing Deployment
        run: |
          echo "🚀 Executing automated deployment on server..."
          /bin/bash /opt/claude-code-agent/scripts/webhook-deploy.sh
